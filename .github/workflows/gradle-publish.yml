name: Publish GitHub Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Select release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build, test, and publish locally
        run: ./gradlew build publishToMavenLocal -Pversion="$RELEASE_VERSION" -Dmaven.repo.local="$RUNNER_TEMP/flight-m2"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}

      - name: Verify publication version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          publication = Path("build/publications/gpr")
          pom = ET.parse(publication / "pom-default.xml").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          assert pom.findtext("m:version", namespaces=namespace) == expected
          assert pom.findtext("m:artifactId", namespaces=namespace) == "flight-jda6"
          metadata = json.loads((publication / "module.json").read_text())
          assert metadata["component"]["version"] == expected
          assert Path("src/main/resources/flight.txt").read_text().splitlines()[0] == expected
          PYTHON

      - name: Publish to GitHub Packages
        run: ./gradlew publishGprPublicationToGitHubPackagesRepository -Pversion="$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
